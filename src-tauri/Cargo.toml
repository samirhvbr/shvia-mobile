[package]
name = "shvia-mobile"
version = "0.6.24"
description = "ShvIA Mobile — cliente iOS/Android do ShvIA (shell fino Tauri 2)"
authors = ["Samir Hanna Verza <samirhv@me.com>"]
edition = "2021"

# A versão acima é mantida em sincronia com version.md por scripts/sync-version.mjs.
# Demais chaves: https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# cdylib p/ Android (.so via NDK), staticlib p/ iOS; rlib p/ o binário de dev no host.
name = "shvia_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Abre links externos (fora dos hosts de SERVER_HOSTS em src/lib.rs) no navegador do SO. Suporta mobile.
tauri-plugin-opener = "2"

# Pin de compatibilidade (não usamos `time` diretamente): o WebView (wry → cookie
# 0.18.1) chama a API antiga de `Parsable::parse`. Fixamos `time` numa versão
# compatível — herdado do SHVIA-DESKTOP. Remover quando wry/cookie subirem.
time = "=0.3.47"

# Biometria (Face ID/Touch ID no iOS, BiometricPrompt no Android) — trava LOCAL
# de acesso à casca (M3, destrava a App Store 4.2). NÃO substitui o cookie de
# sessão remoto (ADR-002): é só um gate local antes de navegar pro ShvIA. O crate
# é `#![cfg(mobile)]` (não existe no host), então fica **fora** de [dependencies]
# — só entra no build iOS/Android; o `cargo check` do host nem o baixa.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-biometric = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-shvia-push = { path = "../plugins/tauri-plugin-shvia-push" }
serde_json = "1"
