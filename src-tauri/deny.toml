# cargo-deny — RustSec advisories for this crate's dependency tree.
#
# Findings DEP-3 / F-31 of the September 2026 technical review: none of the three Rust
# repositories measured advisories, while the third-party sibling `ai-memory` in the same
# folder already had a `deny.toml`.
#
# F-31 predicted the exact hole this file found: the `time = "=0.3.41"` pin, documented as
# debt because of `wry`'s `cookie`, "is the typical case where an advisory would go
# unnoticed". It had one — RUSTSEC-2026-0009 — and the pin turned out to be movable to
# 0.3.47 with no code change at all.
#
# ## The doctrine here is the same as scripts/prova-auditoria.mjs in SHVIA-WORKSPACE
#
# An entry in `ignore` is a debt with a WRITTEN reason and a way to re-check it. "We'll look
# later" is not a reason. An exception whose reason has gone stale is worse than no
# exception, because it reads as a decision.
#
# Run: cargo deny check advisories

[graph]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = [
    # The ten GTK3 entries (RUSTSEC-2024-0411..0420) left on 23/10/2026: RustSec WITHDREW those
    # advisories on 2026-08-14 and cargo-deny reported each ignore as advisory-not-detected.
    # An ignore that matches nothing reads as a decision and guards nothing.

    # ── Compile-time only ──────────────────────────────────────────────────
    # `proc-macro-error` runs during compilation and ships no runtime code.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error — unmaintained, compile-time only, pulled by Tauri's macro crates" },

    # The five `unic-*` ignores (RUSTSEC-2025-0075/0080/0081/0098/0100) left on 23/10/2026 for the
    # same reason: Tauri no longer pulls those crates, cargo-deny reported advisory-not-detected.

    # quick-xml (RUSTSEC-2026-0194/0195, two DoS in the XML parser) left on 23/10/2026: this block
    # said "cannot be fixed here, `plist 1.8.0` requires `^0.38`", and that had gone stale.
    # `cargo update -p plist` takes plist 1.10.3, which accepts the patched quick-xml 0.42.0, so the
    # vulnerability is closed in Cargo.lock instead of accepted (the desktop repository measured
    # the same on its own tree).

    # ── zbus_names / zvariant / zvariant_derive: unmaintained, merged into zbus 6 (16/10/2026) ──
    # No flaw is reported; the standalone crates stopped being maintained. The only path is
    # `tauri-plugin-opener` → `zbus` 5.16, and it is compiled for the desktop Linux target ONLY:
    # `cargo tree -i zbus_names --target aarch64-apple-ios` and `--target aarch64-linux-android`
    # both print "nothing to print" (measured 23/10/2026), so neither shipped mobile build carries
    # it. It is in the graph because cargo-deny walks every target. Re-check when the opener plugin
    # takes zbus 6; this block goes with it.
    { id = "RUSTSEC-2026-0370", reason = "zvariant — unmaintained (merged into zbus 6), no flaw reported, desktop-Linux-only via tauri-plugin-opener; absent from the iOS and Android graphs" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names — unmaintained (merged into zbus 6), no flaw reported, desktop-Linux-only via tauri-plugin-opener; absent from the iOS and Android graphs" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive — unmaintained (merged into zbus 6), no flaw reported, desktop-Linux-only via tauri-plugin-opener; absent from the iOS and Android graphs" },
]

[licenses]
version = 2
# Copyleft in a shipped desktop binary is a licensing trap, not a style preference.
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0",
    "OpenSSL", "Unlicense", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "allow"          # Tauri plugins are sometimes pulled from git
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
