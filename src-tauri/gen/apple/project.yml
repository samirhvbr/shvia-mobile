name: shvia-mobile
options:
  bundleIdPrefix: cloud.blue3.shvia
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: ShvIA
      PRODUCT_BUNDLE_IDENTIFIER: cloud.blue3.shvia
      DEVELOPMENT_TEAM: S65UBCTPN5
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  shvia-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Externals guarda os .a do Rust POR BUILD. Sem o excludes, um `tauri ios
      # init` rodado com a lib já construída faz o XcodeGen copiá-la para o
      # Copy Bundle Resources → ShvIA.app/libapp.a no IPA → Apple recusa o
      # upload com "Invalid bundle structure" (visto em 04/08). O LINK da lib
      # não passa por aqui: é o dependencies: framework libapp.a (embed: false).
      - path: Externals
        excludes:
          - "**/*.a"
      - path: shvia-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: shvia-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Congelados no `tauri ios init` de 14/07 (app estava em 0.2.6); atualizados
        # à mão em 30/07. Quem manda no bundle é `shvia-mobile_iOS/Info.plist`
        # (INFOPLIST_FILE do alvo) — isto aqui só volta a valer se o XcodeGen
        # regenerar o .xcodeproj, o que só acontece num novo `tauri ios init`.
        CFBundleShortVersionString: 0.6.26
        CFBundleVersion: "0.6.26"
        # The four keys below are the SAME lesson as the entitlements block: XcodeGen
        # GENERATES the Info.plist from here, so this is the only place that survives an
        # `xcodegen generate` / `tauri ios init`. They also live in `src-tauri/Info.ios.plist`
        # (the source Tauri would read), but 31/07 proved `ios init` does NOT merge that
        # file — trusting it is what left gen/apple stale from 14/07 to 30/07.
        # 0.6.8 (14/08) deleted all four from the generated plist together with the ~ipad
        # orientations, and the hole went 26 days unseen because no new build came out of
        # this tree since — the 0.6.5 under review is OLDER and carries the keys.
        # Without NSFaceIDUsageDescription iOS KILLS the process on the first evaluatePolicy
        # call, which in this app is the "Ativar Face ID" button of the first run: the very
        # first screen an Apple reviewer sees.
        NSMicrophoneUsageDescription: O microfone é usado para ditar mensagens por voz no chat.
        NSCameraUsageDescription: A câmera é usada para tirar fotos e anexá-las ao chat.
        NSFaceIDUsageDescription: O Face ID desbloqueia o ShvIA localmente, sem digitar a senha a cada acesso.
        # Export-compliance exemption (system HTTPS/TLS only): avoids the manual
        # question on EVERY App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
    # ATENÇÃO: o XcodeGen GERA o arquivo .entitlements a partir daqui a cada
    # regeneração — edição manual no arquivo morre no próximo generate (foi o
    # que apagou o aps-environment em 04/08). A fonte da verdade é ESTE bloco.
    # 'development' vira 'production' no export para App Store Connect.
    entitlements:
      path: shvia-mobile_iOS/shvia-mobile_iOS.entitlements
      properties:
        aps-environment: development
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # iPhone-only (decisão confirmada 14/08, após a rejeição): a Apple
        # revisou em iPad Air e o retrato de iPad é o ponto fraco conhecido do
        # layout (cai na gaveta dos 1080px). Publicar iPhone-only tira o tablet
        # da avaliação e casa com o binário 0.6.5 já no App Store Connect — o
        # reenvio NÃO precisa de build novo, porque as duas correções são
        # server-side. Reativar iPad = tirar esta linha + capturas em paisagem.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a