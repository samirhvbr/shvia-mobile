# Android debug build of SHVIA-MOBILE (OpenClaw-panel card `android`, measured 03/10/2026).
#
# ## Why this exists, and why it is not part of ci.yml
#
# ci.yml says compiling for Android is "an infrastructure decision of its own": the SDK, the NDK
# and the Gradle build cost minutes the cheap checks do not. The price of NOT doing it showed up
# on 03/10/2026: the Android manifest asked for INTERNET only, so voice dictation and "attach a
# photo" silently did nothing on Android, and nothing in CI could see it — the host-target tests
# never open the Android project. This job compiles the debug APK and then READS THE PERMISSIONS
# OUT OF THE APK, which is the file Android actually uses.
#
# ## What keeps the cost down
#
# It runs only when something that goes into the app changes (the `paths` below), on demand
# (workflow_dispatch), and builds ONE architecture (arm64, the phones). Measured here on a warm
# machine: 43 s. A cold runner is slower; the first run on GitHub is the measurement.
#
# ## What it does not do
#
# No signed release, no AAB, no x86/armv7, no device. A signed build needs the owner's key, which
# lives outside the repository (docs/decisoes.md); this job never sees one.

name: Android

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'plugins/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  push:
    branches: [master]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'plugins/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-de-depuracao:
    name: APK de depuração (arm64) e as permissões dentro dele
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The versions measured on 03/10/2026 (the machine that built the APK by hand).
      NDK_VERSION: '28.2.13676358'
      BUILD_TOOLS: '35.0.0'
      PLATFORM: 'android-36'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branch stable em 05/08/2026

      - name: Alvo Rust do Android (arm64)
        run: rustup target add aarch64-linux-android

      # The runner image carries an SDK; the exact platform, build-tools and NDK are installed
      # by version so the build does not depend on what the image happens to ship this month.
      - name: SDK e NDK do Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;${PLATFORM}" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund

      - name: APK de depuração
        run: npx tauri android build --debug --target aarch64 --apk

      # The point of the job. The unit test reads the manifest SOURCE; this reads the manifest that
      # ended up INSIDE the APK, after Gradle merged the plugins' own manifests into it. A
      # permission that never reaches the APK is exactly the defect that went unseen.
      - name: Permissões dentro do APK
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$APK" || { echo "::error::the APK was not produced at $APK"; exit 1; }
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" dump permissions "$APK" | tee permissoes.txt
          for p in INTERNET RECORD_AUDIO CAMERA; do
            grep -q "name='android.permission.$p'" permissoes.txt \
              || { echo "::error::android.permission.$p is not in the APK"; exit 1; }
          done
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" dump badging "$APK" | grep "uses-feature-not-required" | tee recursos.txt
          for f in android.hardware.camera android.hardware.microphone; do
            grep -q "name='$f'" recursos.txt \
              || { echo "::error::$f must be declared and NOT required, or devices without it leave the Play listing"; exit 1; }
          done
